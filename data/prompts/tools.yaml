          SUFFICIENCY: MECHANISM [yes/no], GUARDS [yes/no], EXPLOITABILITY [yes/no].
          WHY THIS CALL: Which criterion is still NO and what this call resolves.
          If all three are YES, do NOT call — give your verdict instead.
    required:
      - macro_name
      - context
